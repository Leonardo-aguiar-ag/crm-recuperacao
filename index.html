// Inicializar eventos de tarefas
function initTarefasEventListeners() {
  // Botão Nova Tarefa
  const btnNova = document.getElementById('btnNovaTarefa');
  if (btnNova) btnNova.addEventListener('click', abrirModalTarefa);

  // Abas
  document.querySelectorAll('#tarefaSubTabs .nav-link').forEach(btn => {
    btn.addEventListener('click', function(e) {
      const view = this.dataset.view;
      if (view) switchTarefaView(view);
    });
  });

  // Filtros e busca
  ['filtroTarefaStatus', 'filtroTarefaOrdenar', 'filtroTarefaBusca'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', renderTarefas);
    if (el && id === 'filtroTarefaBusca') el.addEventListener('input', renderTarefas);
  });

  // Limpar filtros
  const btnLimpar = document.getElementById('btnLimparFiltrosTarefa');
  if (btnLimpar) btnLimpar.addEventListener('click', limparFiltrosTarefa);

  // Navegação calendário
  const btnMesAnt = document.getElementById('btnCalMesAnt');
  const btnMesProx = document.getElementById('btnCalMesProx');
  if (btnMesAnt) btnMesAnt.addEventListener('click', () => mudarMesTarefa(-1));
  if (btnMesProx) btnMesProx.addEventListener('click', () => mudarMesTarefa(1));

  // Modal tarefa - salvar
  const btnSalvar = document.getElementById('btnSalvarTarefa');
  if (btnSalvar) btnSalvar.addEventListener('click', salvarTarefa);

  // Modal tarefa - excluir
  const btnExcluir = document.getElementById('btnExcluirTarefa');
  if (btnExcluir) btnExcluir.addEventListener('click', function() {
    const id = document.getElementById('tarefaId').value;
    if (id) excluirTarefa(id);
  });

  // Busca de leads no modal
  const leadBusca = document.getElementById('tarefaLeadBusca');
  if (leadBusca) leadBusca.addEventListener('input', function() {
    buscarLeadsParaTarefa(this.value);
  });

  // Fechar resultados de busca de leads ao clicar fora
  document.addEventListener('click', function(e) {
    const container = document.getElementById('tarefaLeadResultados');
    if (container && !e.target.closest('#tarefaLeadBusca') && !e.target.closest('#tarefaLeadResultados')) {
      container.style.display = 'none';
    }
  });
}

function switchTarefaView(view) {
  tarefaView = view;
  document.querySelectorAll('#tarefaSubTabs .nav-link').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === view);
  });
  document.querySelectorAll('.tarefa-view').forEach(el => el.style.display = 'none');
  if (view === 'lista') {
    document.getElementById('tarefaListView').style.display = 'block';
    renderTarefas();
  } else if (view === 'calendario') {
    document.getElementById('tarefaCalendarioView').style.display = 'block';
    renderCalendarioTarefa();
  } else if (view === 'dashboard') {
    document.getElementById('tarefaDashboardView').style.display = 'block';
    renderDashboardTarefas();
  }
}

function renderTarefas() {
  const container = document.getElementById('tarefaListContainer');
  if (!container) return;
  const statusFiltro = document.getElementById('filtroTarefaStatus')?.value || 'todas';
  const ordenar = document.getElementById('filtroTarefaOrdenar')?.value || 'prazo';
  const busca = document.getElementById('filtroTarefaBusca')?.value.toLowerCase() || '';
  let lista = [...tarefas];
  if (statusFiltro === 'pendente') lista = lista.filter(t => !t.concluida);
  else if (statusFiltro === 'hoje') {
    const hoje = new Date().toISOString().split('T')[0];
    lista = lista.filter(t => t.data === hoje && !t.concluida);
  } else if (statusFiltro === 'vencida') {
    const hoje = new Date().toISOString().split('T')[0];
    lista = lista.filter(t => t.data < hoje && !t.concluida);
  } else if (statusFiltro === 'concluida') lista = lista.filter(t => t.concluida);
  if (busca) {
    lista = lista.filter(t => (t.titulo||'').toLowerCase().includes(busca) || ((t.leadNome||'').toLowerCase().includes(busca)));
  }
  if (ordenar === 'prazo') lista.sort((a,b) => (a.data||'').localeCompare(b.data||''));
  else if (ordenar === 'criacao') lista.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
  else if (ordenar === 'urgencia') {
    const ordem = {'Urgente':0,'Alta':1,'Normal':2,'Baixa':3};
    lista.sort((a,b) => (ordem[a.urgencia]||2) - (ordem[b.urgencia]||2));
  }
  const hoje = new Date().toISOString().split('T')[0];
  document.getElementById('statPendentes').innerText = tarefas.filter(t => !t.concluida).length;
  document.getElementById('statHoje').innerText = tarefas.filter(t => t.data === hoje && !t.concluida).length;
  document.getElementById('statVencidas').innerText = tarefas.filter(t => t.data < hoje && !t.concluida).length;
  document.getElementById('statConcluidas').innerText = tarefas.filter(t => t.concluida).length;
  if (!lista.length) {
    container.innerHTML = '<p class="text-muted text-center py-3">Nenhuma tarefa encontrada.</p>';
    return;
  }
  container.innerHTML = lista.map(t => {
    const hojeStr = new Date().toISOString().split('T')[0];
    let classe = '';
    if (t.concluida) classe = 'concluida';
    else if (t.data < hojeStr) classe = 'vencida';
    else if (t.data === hojeStr) classe = 'hoje';
    const urgClass = 'tarefa-urg-' + (t.urgencia || 'normal').toLowerCase();
    return `
      <div class="tarefa-card ${classe} ${urgClass}">
        <div>
          <strong>${t.titulo || 'Sem título'}</strong>
          <span class="badge bg-secondary">${t.tipo || 'Tarefa'}</span>
          <span class="badge ${t.concluida ? 'bg-success' : (t.data < hojeStr ? 'bg-danger' : 'bg-primary')}">${t.concluida ? '✅ Concluída' : (t.data < hojeStr ? '⚠️ Vencida' : (t.data === hojeStr ? '📌 Hoje' : '📅 ' + formatarDataBr(t.data)))}</span>
          ${t.urgencia ? `<span class="badge ${t.urgencia === 'Urgente' ? 'bg-danger' : t.urgencia === 'Alta' ? 'bg-warning' : t.urgencia === 'Baixa' ? 'bg-secondary' : 'bg-primary'}">${t.urgencia}</span>` : ''}
          ${t.leadNome ? `<span class="badge bg-info">🔗 ${t.leadNome}</span>` : ''}
          <div class="small text-muted">${t.descricao || ''}</div>
        </div>
        <div>
          <button class="btn btn-sm btn-outline-primary" onclick="editarTarefa('${t.id}')"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-success" onclick="toggleConcluirTarefa('${t.id}')"><i class="bi ${t.concluida ? 'bi-arrow-counterclockwise' : 'bi-check'}"></i></button>
          <button class="btn btn-sm btn-danger" onclick="excluirTarefa('${t.id}')"><i class="bi bi-trash"></i></button>
        </div>
      </div>
    `;
  }).join('');
}

function limparFiltrosTarefa() {
  const status = document.getElementById('filtroTarefaStatus');
  const ordenar = document.getElementById('filtroTarefaOrdenar');
  const busca = document.getElementById('filtroTarefaBusca');
  if (status) status.value = 'todas';
  if (ordenar) ordenar.value = 'prazo';
  if (busca) busca.value = '';
  renderTarefas();
}

function renderCalendarioTarefa() {
  const mes = calendarioMesTarefa, ano = calendarioAnoTarefa;
  const titulo = document.getElementById('calendarioTarefaTitulo');
  if (titulo) titulo.innerText = new Date(ano, mes).toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
  const container = document.getElementById('calendarioTarefaContainer');
  if (!container) return;
  const primeiroDia = new Date(ano, mes, 1).getDay();
  const diasNoMes = new Date(ano, mes + 1, 0).getDate();
  let html = '<div class="mini-calendar">';
  const diasSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  diasSemana.forEach(d => html += `<div class="fw-bold text-center">${d}</div>`);
  for (let i = 0; i < primeiroDia; i++) html += '<div></div>';
  for (let d = 1; d <= diasNoMes; d++) {
    const dataStr = `${ano}-${String(mes + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hoje = new Date().toISOString().split('T')[0];
    const hasEvent = tarefas.some(t => t.data === dataStr);
    const selected = dataStr === diaSelecionadoTarefa ? 'selected' : '';
    const today = dataStr === hoje ? 'today' : '';
    html += `<div class="day ${today} ${selected} ${hasEvent ? 'has-event' : ''}" onclick="selecionarDiaTarefa('${dataStr}')">${d}</div>`;
  }
  html += '</div>';
  container.innerHTML = html;
  // Tarefas do dia selecionado
  document.getElementById('tarefaDiaSelecionadoLabel').innerText = diaSelecionadoTarefa;
  const lista = document.getElementById('tarefasDoDiaLista');
  if (!lista) return;
  const tarefasDoDia = tarefas.filter(t => t.data === diaSelecionadoTarefa);
  if (!tarefasDoDia.length) {
    lista.innerHTML = '<p class="text-muted">Nenhuma tarefa para este dia.</p>';
    return;
  }
  lista.innerHTML = tarefasDoDia.map(t => `
    <div class="tarefa-card">
      <div>
        <strong>${t.titulo}</strong> ${t.hora ? '- ' + t.hora : ''}
        <span class="badge ${t.concluida ? 'bg-success' : 'bg-primary'}">${t.concluida ? '✅ Concluída' : '⏳ Pendente'}</span>
        ${t.urgencia ? `<span class="badge bg-${t.urgencia === 'Urgente' ? 'danger' : t.urgencia === 'Alta' ? 'warning' : 'secondary'}">${t.urgencia}</span>` : ''}
      </div>
      <div>
        <button class="btn btn-sm btn-outline-primary" onclick="editarTarefa('${t.id}')"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-success" onclick="toggleConcluirTarefa('${t.id}')"><i class="bi ${t.concluida ? 'bi-arrow-counterclockwise' : 'bi-check'}"></i></button>
      </div>
    </div>
  `).join('');
}

function selecionarDiaTarefa(data) {
  diaSelecionadoTarefa = data;
  renderCalendarioTarefa();
}

function mudarMesTarefa(delta) {
  calendarioMesTarefa += delta;
  if (calendarioMesTarefa > 11) { calendarioMesTarefa = 0; calendarioAnoTarefa++; }
  if (calendarioMesTarefa < 0) { calendarioMesTarefa = 11; calendarioAnoTarefa--; }
  renderCalendarioTarefa();
}

function renderDashboardTarefas() {
  // Gráficos (usando Chart.js)
  const ctx1 = document.getElementById('tarefaTipoChart')?.getContext('2d');
  if (ctx1) {
    if (charts.tarefaTipo) charts.tarefaTipo.destroy();
    const tipos = {};
    tarefas.filter(t => !t.concluida).forEach(t => {
      tipos[t.tipo || 'Tarefa'] = (tipos[t.tipo || 'Tarefa'] || 0) + 1;
    });
    charts.tarefaTipo = new Chart(ctx1, {
      type: 'doughnut',
      data: {
        labels: Object.keys(tipos),
        datasets: [{ data: Object.values(tipos), backgroundColor: ['#6c5ce7','#00b894','#fdcb6e','#e17055','#0984e3'] }]
      }
    });
  }
  const ctx2 = document.getElementById('tarefaUrgenciaChart')?.getContext('2d');
  if (ctx2) {
    if (charts.tarefaUrgencia) charts.tarefaUrgencia.destroy();
    const urgencias = {};
    tarefas.filter(t => !t.concluida).forEach(t => {
      urgencias[t.urgencia || 'Normal'] = (urgencias[t.urgencia || 'Normal'] || 0) + 1;
    });
    charts.tarefaUrgencia = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: Object.keys(urgencias),
        datasets: [{ data: Object.values(urgencias), backgroundColor: ['#e17055','#fdcb6e','#6c5ce7','#6c757d'] }]
      }
    });
  }
  const ctx3 = document.getElementById('tarefaConclusoesChart')?.getContext('2d');
  if (ctx3) {
    if (charts.tarefaConclusoes) charts.tarefaConclusoes.destroy();
    const hoje = new Date();
    const dias = [];
    for (let i = 29; i >= 0; i--) {
      const d = new Date(hoje);
      d.setDate(d.getDate() - i);
      const key = d.toISOString().split('T')[0];
      dias.push({ key, label: d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) });
    }
    const concluidos = dias.map(d => tarefas.filter(t => t.concluida && t.data === d.key).length);
    charts.tarefaConclusoes = new Chart(ctx3, {
      type: 'line',
      data: {
        labels: dias.map(d => d.label),
        datasets: [{ label: 'Concluídas', data: concluidos, borderColor: '#00b894', fill: false }]
      }
    });
  }
}

  const modal = new bootstrap.Modal(document.getElementById('modalTarefa'));
  document.getElementById('modalTarefaTitulo').innerText = 'Nova Tarefa';
  document.getElementById('tarefaId').value = '';
  document.getElementById('tarefaTitulo').value = '';
  document.getElementById('tarefaTipo').value = 'Tarefa';
  document.getElementById('tarefaData').value = '';
  document.getElementById('tarefaHora').value = '';
  document.getElementById('tarefaUrgencia').value = 'Normal';
  document.getElementById('tarefaDesc').value = '';
  document.getElementById('tarefaConcluida').checked = false;
  document.getElementById('tarefaLeadId').value = '';
  document.getElementById('tarefaLeadSelecionado').innerHTML = '';
  document.getElementById('tarefaLeadBusca').value = '';
  document.getElementById('btnExcluirTarefa').style.display = 'none';
  modal.show();
}

function editarTarefa(id) {
  const t = tarefas.find(t => t.id === id);
  if (!t) return;
  const modal = new bootstrap.Modal(document.getElementById('modalTarefa'));
  document.getElementById('modalTarefaTitulo').innerText = 'Editar Tarefa';
  document.getElementById('tarefaId').value = t.id;
  document.getElementById('tarefaTitulo').value = t.titulo || '';
  document.getElementById('tarefaTipo').value = t.tipo || 'Tarefa';
  document.getElementById('tarefaData').value = t.data || '';
  document.getElementById('tarefaHora').value = t.hora || '';
  document.getElementById('tarefaUrgencia').value = t.urgencia || 'Normal';
  document.getElementById('tarefaDesc').value = t.descricao || '';
  document.getElementById('tarefaConcluida').checked = t.concluida || false;
  document.getElementById('tarefaLeadId').value = t.leadId || '';
  if (t.leadId) {
    const lead = leadsData.find(l => l.id === t.leadId);
    document.getElementById('tarefaLeadSelecionado').innerHTML = lead ? `<span class="badge bg-info">🔗 ${lead.nome}</span>` : '';
  } else {
    document.getElementById('tarefaLeadSelecionado').innerHTML = '';
  }
  document.getElementById('tarefaLeadBusca').value = '';
  document.getElementById('btnExcluirTarefa').style.display = 'inline-block';
  modal.show();
}

async function salvarTarefa() {
  const id = document.getElementById('tarefaId').value;
  const titulo = document.getElementById('tarefaTitulo').value.trim();
  if (!titulo) return alert('O título é obrigatório.');
  const data = document.getElementById('tarefaData').value;
  if (!data) return alert('A data é obrigatória.');
  const leadId = document.getElementById('tarefaLeadId').value;
  const leadNome = leadId ? (leadsData.find(l => l.id === leadId)?.nome || '') : '';
  const obj = {
    titulo,
    tipo: document.getElementById('tarefaTipo').value,
    data,
    hora: document.getElementById('tarefaHora').value,
    urgencia: document.getElementById('tarefaUrgencia').value,
    descricao: document.getElementById('tarefaDesc').value,
    concluida: document.getElementById('tarefaConcluida').checked,
    leadId,
    leadNome,
    userId: currentUser.uid,
    updatedAt: new Date().toISOString()
  };
  try {
    if (id) {
      await db.collection('tarefas').doc(id).update(obj);
      const idx = tarefas.findIndex(t => t.id === id);
      if (idx !== -1) tarefas[idx] = { ...tarefas[idx], ...obj };
    } else {
      obj.createdAt = new Date().toISOString();
      const ref = await db.collection('tarefas').add(obj);
      tarefas.push({ id: ref.id, ...obj });
    }
    bootstrap.Modal.getInstance(document.getElementById('modalTarefa')).hide();
    renderTarefas();
    renderCalendarioTarefa();
    renderDashboardTarefas();
  } catch(e) {
    console.error('Erro ao salvar tarefa:', e);
    alert('Erro ao salvar: ' + e.message);
  }
}

async function excluirTarefa(id) {
  if (!confirm('Excluir esta tarefa?')) return;
  try {
    await db.collection('tarefas').doc(id).delete();
    tarefas = tarefas.filter(t => t.id !== id);
    bootstrap.Modal.getInstance(document.getElementById('modalTarefa'))?.hide();
    renderTarefas();
    renderCalendarioTarefa();
    renderDashboardTarefas();
  } catch(e) {
    console.error('Erro ao excluir tarefa:', e);
    alert('Erro ao excluir: ' + e.message);
  }
}

async function toggleConcluirTarefa(id) {
  const t = tarefas.find(t => t.id === id);
  if (!t) return;
  try {
    await db.collection('tarefas').doc(id).update({ concluida: !t.concluida });
    t.concluida = !t.concluida;
    renderTarefas();
    renderCalendarioTarefa();
    renderDashboardTarefas();
  } catch(e) {
    console.error('Erro ao concluir tarefa:', e);
    alert('Erro: ' + e.message);
  }
}

function buscarLeadsParaTarefa(termo) {
  const resultados = document.getElementById('tarefaLeadResultados');
  if (!resultados) return;
  if (!termo.trim()) { resultados.style.display = 'none'; return; }
  const filtrados = leadsData.filter(l => (l.nome || '').toLowerCase().includes(termo.toLowerCase())).slice(0, 5);
  if (!filtrados.length) {
    resultados.innerHTML = '<div class="dropdown-item text-muted">Nenhum lead encontrado</div>';
    resultados.style.display = 'block';
    return;
  }
  resultados.innerHTML = filtrados.map(l => `
    <div class="dropdown-item" style="cursor:pointer;" onclick="selecionarLeadTarefa('${l.id}','${l.nome}')">${l.nome} ${l.telefone ? '- '+l.telefone : ''}</div>
  `).join('');
  resultados.style.display = 'block';
}

function selecionarLeadTarefa(id, nome) {
  document.getElementById('tarefaLeadId').value = id;
  document.getElementById('tarefaLeadSelecionado').innerHTML = `<span class="badge bg-info">🔗 ${nome}</span>`;
  document.getElementById('tarefaLeadBusca').value = '';
  document.getElementById('tarefaLeadResultados').style.display = 'none';
}

// ==================== UTILITÁRIOS ====================
function formatarMoeda(valor) {
  if (typeof valor === 'string') valor = parseFloat(valor.replace(/\./g,'').replace(',','.'));
  if (isNaN(valor) || valor === null || valor === undefined) return 'R$ 0,00';
  return 'R$ ' + valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatarNumero(valor) {
  if (typeof valor === 'string') valor = parseFloat(valor.replace(/\./g,'').replace(',','.'));
  if (isNaN(valor) || valor === null || valor === undefined) return '0,00';
  return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatarDataBr(data) {
  if (!data) return '-';
  const d = new Date(data);
  return d.toLocaleDateString('pt-BR');
}
function formatarValorInput(el) {
  let val = el.value.replace(/\D/g,'');
  if (val) { val = (parseFloat(val)/100).toFixed(2); el.value = val.replace('.',','); }
}

document.addEventListener('DOMContentLoaded', function() {
  // Sidebar navigation
  document.querySelectorAll('.sidebar .nav-link').forEach(el => {
    el.addEventListener('click', function(e) {
      const tabId = this.getAttribute('data-tab');
      if (tabId) switchTab(tabId);
    });
  });
  // Tabela ordenação
  document.querySelectorAll('#pesquisaTable thead th[data-col]').forEach(th => {
    th.style.cursor = 'pointer';
    th.addEventListener('click', function() {
      const col = this.dataset.col;
      if (sortColumn === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortColumn = col; sortDir = 'asc'; }
      renderTable();
    });
  });
  // Período
  document.getElementById('periodoFiltro').addEventListener('change', function() {
    const val = this.value;
    document.getElementById('intervaloDiv').style.display = val === 'intervalo' ? 'block' : 'none';
    document.getElementById('intervaloFimDiv').style.display = val === 'intervalo' ? 'block' : 'none';
    updateDashboard();
  });
  document.getElementById('filtroPraca').addEventListener('change', updateDashboard);
  document.getElementById('dataInicioIntervalo').addEventListener('change', updateDashboard);
  document.getElementById('dataFimIntervalo').addEventListener('change', updateDashboard);
  // Inicializar
  switchTab('dashboardTab');
  setLeadView('lista');
  // Tarefas (já inicializado em loadAll)
  setInterval(atualizarInfoBackup, 60000);
  // Fechar dropdowns ao clicar fora
  document.addEventListener('click', function(e) {
    const container = document.getElementById('resultadosBuscaGlobal');
    if (container && !e.target.closest('.left-actions')) container.style.display = 'none';
    const notif = document.getElementById('notifDropdown');
    if (notif && !e.target.closest('#btnNotificacoes') && !e.target.closest('#notifDropdown')) notif.classList.remove('show');
  });
});

function switchTab(tabId) {
  document.querySelectorAll('.sidebar .nav-link').forEach(el => el.classList.remove('active'));
  document.querySelector(`.sidebar .nav-link[data-tab="${tabId}"]`)?.classList.add('active');
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('show','active'));
  const pane = document.getElementById(tabId);
  if (pane) pane.classList.add('show','active');
  document.getElementById('sidebar').classList.remove('mobile-open');
  if (tabId === 'leadsTab') renderLeads();
  if (tabId === 'pesquisaTab') { renderTable(); carregarFiltrosSalvos(); }
  if (tabId === 'clientesTab') { switchInternalTab('dadosPrincipais'); carregarVendedoresSelect(); }
  if (tabId === 'tarefasTab') {
    // Se a aba de tarefas for aberta, garantir que a view atual seja renderizada
    switchTarefaView(tarefaView);
  }
}

function switchInternalTab(tabId) {
  document.querySelectorAll('#clientesTab .tab-pane').forEach(p => p.style.display = 'none');
  const pane = document.getElementById(tabId);
  if (pane) pane.style.display = 'block';
  document.querySelectorAll('#fichaTabs .nav-link').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`#fichaTabs .nav-link[data-tab="${tabId}"]`)?.classList.add('active');
}
