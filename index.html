<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM Recupera AI - v4.1</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg: #f0f2f8;
      --card: #ffffff;
      --border: #d0d7e6;
      --text: #0b1a2e;
      --text-secondary: #4a5a72;
      --primary: #6c5ce7;
      --primary-dark: #5a4bd1;
      --primary-light: #ede9fe;
      --success: #00b894;
      --warning: #fdcb6e;
      --danger: #e17055;
      --info: #0984e3;
      --purple: #a29bfe;
      --pink: #fd79a8;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 12px 40px rgba(108, 92, 231, 0.10);
      --shadow-hover: 0 20px 50px rgba(108, 92, 231, 0.18);
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --sidebar-width: 220px;
      --sidebar-collapsed: 60px;
    }

    body.dark-mode {
      --bg: #0c111f;
      --card: #182237;
      --border: #3a4a66;
      --text: #eef2f8;
      --text-secondary: #b0bdd5;
      --primary-light: #1e1a3a;
      --shadow: 0 12px 40px rgba(0,0,0,0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.5;
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      background: var(--card);
      border-right: 2px solid var(--border);
      padding: 1rem 0;
      z-index: 1050;
      transition: width 0.3s ease, transform 0.3s ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
    .sidebar .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.8rem 1rem;
      border-bottom: 2px solid var(--border);
      margin-bottom: 1rem;
      min-height: 70px;
    }
    .sidebar .logo i {
      font-size: 2rem;
      color: var(--primary);
      background: var(--primary-light);
      padding: 6px;
      border-radius: var(--radius-sm);
    }
    .sidebar .logo span {
      font-weight: 900;
      font-size: 1.2rem;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .sidebar.collapsed .logo span { opacity: 0; width: 0; overflow: hidden; }

    .sidebar .nav-items {
      flex: 1;
      overflow-y: auto;
      padding: 0 0.5rem;
    }
    .sidebar .nav-items .nav-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .sidebar .nav-items .nav-link:hover {
      background: var(--primary-light);
      color: var(--primary);
    }
    .sidebar .nav-items .nav-link.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(108,92,231,0.3);
    }
    .sidebar .nav-items .nav-link i { font-size: 1.3rem; min-width: 24px; }
    .sidebar.collapsed .nav-items .nav-link .link-text { opacity: 0; width: 0; overflow: hidden; }
    .sidebar.collapsed .nav-items .nav-link { justify-content: center; padding: 0.7rem 0.5rem; }

    .main-content {
      margin-left: var(--sidebar-width);
      padding: 2rem;
      transition: margin-left 0.3s ease;
    }
    .main-content.expanded { margin-left: var(--sidebar-collapsed); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }
    .card:hover { box-shadow: var(--shadow-hover); }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: white;
      transition: all var(--transition);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
    }

    .pipeline-column {
      background: var(--primary-light);
      border-radius: var(--radius-sm);
      padding: 1rem;
      min-width: 280px;
      max-height: 600px;
      overflow-y: auto;
    }

    .pipeline-card {
      background: var(--card);
      padding: 1rem;
      margin-bottom: 0.8rem;
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      cursor: move;
    }

    .p-name { font-weight: 600; margin-bottom: 0.5rem; }
    .p-detail {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.show { transform: translateX(0); }
      .main-content { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="logo">
      <i class="bi bi-graph-up"></i>
      <span>CRM Recupera AI</span>
    </div>
    <div class="nav-items">
      <a class="nav-link active" data-tab="dashboardTab"><i class="bi bi-house-fill"></i><span class="link-text">Dashboard</span></a>
      <a class="nav-link" data-tab="leadsTab"><i class="bi bi-people-fill"></i><span class="link-text">Leads</span></a>
      <a class="nav-link" data-tab="clientesTab"><i class="bi bi-person-check-fill"></i><span class="link-text">Clientes</span></a>
      <a class="nav-link" data-tab="configTab"><i class="bi bi-gear-fill"></i><span class="link-text">Configurações</span></a>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-outline-danger btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sair</button>
    </div>
  </div>

  <div class="main-content" id="mainContent">
    <div id="dashboardTab" class="tab-content active">
      <h2>Dashboard</h2>
      <div class="row mt-4">
        <div class="col-md-3"><div class="card p-3"><h5>Propostas</h5><h2 id="propostas">0</h2></div></div>
        <div class="col-md-3"><div class="card p-3"><h5>Clientes</h5><h2 id="clientes">0</h2></div></div>
        <div class="col-md-3"><div class="card p-3"><h5>Taxa Conversão</h5><h2 id="conversao">0%</h2></div></div>
        <div class="col-md-3"><div class="card p-3"><h5>Leads</h5><h2 id="totalLeads">0</h2></div></div>
      </div>
    </div>

    <div id="leadsTab" class="tab-content">
      <h2>Gerenciador de Leads</h2>
      <button class="btn btn-primary mt-3" onclick="abrirModalNovoLead()"><i class="bi bi-plus-circle me-2"></i>Novo Lead</button>
      <div id="leadsContainer" class="mt-3"></div>
      <div id="pipelineContainer" class="d-flex gap-3 mt-3" style="overflow-x: auto;"></div>
    </div>

    <div id="clientesTab" class="tab-content">
      <h2>Clientes</h2>
      <div id="clientesContainer" class="mt-3"></div>
    </div>

    <div id="configTab" class="tab-content">
      <h2>Configurações</h2>
      <div class="row">
        <div class="col-md-6">
          <div class="card p-3">
            <h5>Status de Leads</h5>
            <div id="statusSidebar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Novo Lead -->
  <div class="modal fade" id="modalNovoLead" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Novo Lead</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" id="novoLeadNome" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="tel" id="novoLeadTelefone" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" id="novoLeadEmail" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">Cidade</label>
            <input type="text" id="novoLeadCidade" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">UF</label>
            <select id="novoLeadUf" class="form-select">
              <option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option>
              <option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option>
              <option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option>
              <option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
              <option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option>
              <option>SE</option><option>TO</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Status</label>
            <select id="novoLeadStatus" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Observações</label>
            <textarea id="novoLeadObs" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnSalvarNovoLead" class="btn btn-primary">Salvar Lead</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== VARIÁVEIS GLOBAIS ==========
    let leadsData = [];
    let clientesData = [];
    let leadStatuses = [
      { id: 1, name: 'Disponível' },
      { id: 2, name: 'Em Atendimento' },
      { id: 3, name: 'Em Negociação' },
      { id: 4, name: 'Perfil Inválido' },
      { id: 5, name: 'Convertido' }
    ];
    let currentUser = null;
    let db = null;
    let leadView = 'lista';
    let paginaLead = 1;

    // ========== FIREBASE INIT ==========
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKey123456789",
      authDomain: "seu-app.firebaseapp.com",
      projectId: "seu-project-id",
      storageBucket: "seu-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      firebase.auth().onAuthStateChanged(user => {
        currentUser = user;
        if (user) {
          loadLeads();
          loadClients();
        } else {
          alert('Não autenticado');
        }
      });
    } catch (e) {
      console.error('Firebase init error:', e);
    }

    // ========== CRUD LEADS ==========
    async function loadLeads() {
      try {
        if (!db || !currentUser) return;
        const snap = await db.collection('leads').where('userId', '==', currentUser.uid).get();
        leadsData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderLeads();
        atualizarSidebarStatus();
      } catch (err) {
        console.error('Erro ao carregar leads:', err);
      }
    }

    function renderLeads() {
      const container = document.getElementById('leadsContainer');
      const html = leadsData.map(l => `
        <div class="card p-3 mb-2">
          <div class="row">
            <div class="col-md-8">
              <h6>${l.nome || 'Sem nome'}</h6>
              <small>${l.telefone || '-'} | ${l.email || '-'}</small>
            </div>
            <div class="col-md-4 text-end">
              <button class="btn btn-sm btn-outline-primary" onclick="editarLead('${l.id}')"><i class="bi bi-pencil"></i></button>
              <button class="btn btn-sm btn-danger" onclick="excluirLead('${l.id}')"><i class="bi bi-trash"></i></button>
            </div>
          </div>
        </div>
      `).join('');
      container.innerHTML = html || '<p class="text-muted">Nenhum lead</p>';
    }

    function renderPipeline() {
      const container = document.getElementById('pipelineContainer');
      const colors = { 'Disponível': '#6c5ce7', 'Em Atendimento': '#fdcb6e', 'Em Negociação': '#0984e3', 'Perfil Inválido': '#e17055', 'Convertido': '#00b894' };
      
      const allStatuses = leadStatuses.map(s => s.name);
      let html = '';
      allStatuses.forEach(status => {
        const cards = leadsData.filter(l => (l.status || 'Disponível') === status);
        html += `
          <div class="pipeline-column">
            <h6>${status} (${cards.length})</h6>
            ${cards.map(l => `
              <div class="pipeline-card" style="border-left-color: ${colors[status]}">
                <div class="p-name">${l.nome || 'Sem nome'}</div>
                <div class="p-detail"><span>${l.telefone || '-'}</span></div>
                <div class="mt-2">
                  <button class="btn btn-sm btn-outline-primary" onclick="editarLead('${l.id}')"><i class="bi bi-pencil"></i></button>
                  <button class="btn btn-sm btn-danger" onclick="excluirLead('${l.id}')"><i class="bi bi-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      });
      container.innerHTML = html;
    }

    async function abrirModalNovoLead() {
      document.querySelector('#modalNovoLead .modal-title').innerHTML = '<i class="bi bi-person-plus me-2"></i>Novo Lead';
      ['novoLeadNome', 'novoLeadTelefone', 'novoLeadEmail', 'novoLeadCidade', 'novoLeadObs'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('novoLeadUf').value = '';
      document.getElementById('novoLeadStatus').value = leadStatuses[0]?.name || '';
      document.getElementById('modalNovoLead').dataset.editId = '';
      new bootstrap.Modal(document.getElementById('modalNovoLead')).show();
    }

    async function salvarNovoLead() {
      try {
        const nome = document.getElementById('novoLeadNome').value.trim();
        const telefone = document.getElementById('novoLeadTelefone').value.trim();
        if (!nome || !telefone) return alert('Nome e telefone são obrigatórios');
        
        const data = {
          nome, telefone,
          email: document.getElementById('novoLeadEmail').value.trim(),
          cidade: document.getElementById('novoLeadCidade').value.trim(),
          uf: document.getElementById('novoLeadUf').value,
          status: document.getElementById('novoLeadStatus').value || 'Disponível',
          observacoes: document.getElementById('novoLeadObs').value.trim(),
          abertura: new Date().toISOString().split('T')[0],
          userId: currentUser.uid,
          createdAt: new Date().toISOString()
        };
        await db.collection('leads').add(data);
        bootstrap.Modal.getInstance(document.getElementById('modalNovoLead')).hide();
        await loadLeads();
      } catch (err) {
        console.error('Erro ao salvar lead:', err);
        alert('Erro ao salvar lead');
      }
    }

    function editarLead(id) {
      const l = leadsData.find(l => l.id === id);
      if (!l) return;
      document.querySelector('#modalNovoLead .modal-title').innerHTML = '<i class="bi bi-pencil me-2"></i>Editar Lead';
      document.getElementById('novoLeadNome').value = l.nome || '';
      document.getElementById('novoLeadTelefone').value = l.telefone || '';
      document.getElementById('novoLeadEmail').value = l.email || '';
      document.getElementById('novoLeadCidade').value = l.cidade || '';
      document.getElementById('novoLeadUf').value = l.uf || '';
      document.getElementById('novoLeadStatus').value = l.status || 'Disponível';
      document.getElementById('novoLeadObs').value = l.observacoes || '';
      document.getElementById('modalNovoLead').dataset.editId = id;
      document.getElementById('btnSalvarNovoLead').innerHTML = 'Atualizar Lead';
      document.getElementById('btnSalvarNovoLead').onclick = atualizarLead;
      new bootstrap.Modal(document.getElementById('modalNovoLead')).show();
    }

    async function atualizarLead() {
      try {
        const id = document.getElementById('modalNovoLead').dataset.editId;
        if (!id) return;
        const nome = document.getElementById('novoLeadNome').value.trim();
        const telefone = document.getElementById('novoLeadTelefone').value.trim();
        if (!nome || !telefone) return alert('Nome e telefone são obrigatórios');
        
        await db.collection('leads').doc(id).update({
          nome, telefone,
          email: document.getElementById('novoLeadEmail').value.trim(),
          cidade: document.getElementById('novoLeadCidade').value.trim(),
          uf: document.getElementById('novoLeadUf').value,
          status: document.getElementById('novoLeadStatus').value || 'Disponível',
          observacoes: document.getElementById('novoLeadObs').value.trim(),
          updatedAt: new Date().toISOString()
        });
        bootstrap.Modal.getInstance(document.getElementById('modalNovoLead')).hide();
        await loadLeads();
      } catch (err) {
        console.error('Erro ao atualizar lead:', err);
        alert('Erro ao atualizar lead');
      }
    }

    async function excluirLead(id) {
      if (!confirm('Excluir este lead?')) return;
      try {
        await db.collection('leads').doc(id).delete();
        await loadLeads();
      } catch (err) {
        console.error('Erro ao excluir lead:', err);
      }
    }

    function atualizarSidebarStatus() {
      const statusCount = {};
      leadStatuses.forEach(s => statusCount[s.name] = 0);
      leadsData.forEach(l => {
        const st = l.status || 'Disponível';
        statusCount[st] = (statusCount[st] || 0) + 1;
      });
      const html = Object.entries(statusCount).map(([status, count]) => `
        <div class="d-flex justify-content-between mb-2">
          <span><strong>${status}</strong></span>
          <span class="badge bg-primary">${count}</span>
        </div>
      `).join('');
      document.getElementById('statusSidebar').innerHTML = html;
    }

    async function loadClients() {
      try {
        if (!db || !currentUser) return;
        const snap = await db.collection('clientes').where('userId', '==', currentUser.uid).get();
        clientesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } catch (err) {
        console.error('Erro ao carregar clientes:', err);
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
      if (tabId === 'leadsTab' && leadView === 'pipeline') renderPipeline();
    }

    function setLeadView(view) {
      leadView = view;
      if (view === 'pipeline') renderPipeline();
      else renderLeads();
    }

    function logout() {
      firebase.auth().signOut().then(() => {
        alert('Desconectado');
        location.reload();
      }).catch(err => console.error('Logout error:', err));
    }

    // ========== INICIALIZAÇÃO ==========
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.nav-link').forEach(el => {
        el.addEventListener('click', () => {
          const tabId = el.getAttribute('data-tab');
          if (tabId) switchTab(tabId);
        });
      });
      const statusSelect = document.getElementById('novoLeadStatus');
      leadStatuses.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.text = s.name;
        statusSelect.appendChild(opt);
      });
    });
  </script>
</body>
</html>
